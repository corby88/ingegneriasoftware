<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Simulatore Esame - Ingegneria del Software</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Simulatore Esame - Ingegneria del Software</h1>

    <div id="quiz-container">

      <!-- 📊 Contatore -->
      <h3 id="progress"></h3>

      <!-- ❓ Domanda -->
      <h2 id="question"></h2>

      <!-- 📋 Risposte -->
      <div id="answers"></div>

      <!-- ▶️ Bottone Prossima -->
      <button id="nextBtn" onclick="nextQuestion()">Prossima</button>

    </div>

    <!-- 📊 Risultato -->
    <h3 id="score"></h3>
  </div>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>
</html>
